name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (builds a draft release)'
        required: true
        default: '0.2.0'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: dotnet restore windows/OmaSend/OmaSend.csproj --locked-mode
      - run: dotnet run --project windows/OmaSend.Tests -c Release
      - run: ./tests/installer.ps1
      - name: Install Setup compiler
        run: choco install innosetup --version=6.7.3 -y --no-progress
      - run: pip install -r tests/requirements.txt
      - run: python tests/interop.py --bridge windows/OmaSend.Tests/bin/Release/net10.0/OmaSend.Tests.dll
        env:
          PYTHONIOENCODING: utf-8
      - name: Package Windows
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*_Setup.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache: false
      - run: cd linux && go test ./... && go vet ./...
      - name: Package Linux
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/*.tar.gz
  macos:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      OMASEND_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      OMASEND_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - run: cd macos && swift test
      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          [[ -n "$APPLE_NOTARY_KEY_BASE64" && -n "$OMASEND_NOTARY_KEY_ID" && -n "$OMASEND_NOTARY_ISSUER" ]] || { echo "APPLE_NOTARY_* secrets are required when APPLE_CERTIFICATE_P12_BASE64 is set" >&2; exit 1; }
          SIGNING_KEYCHAIN="$RUNNER_TEMP/omasend-signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$password" "$SIGNING_KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity was imported" >&2; exit 1; }
          echo "OMASEND_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize macOS app
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          brew install create-dmg
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" > "$RUNNER_TEMP/notary-key.b64"
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" OMASEND_NOTARY_KEY_BASE64_FILE="$RUNNER_TEMP/notary-key.b64" bash macos/script/package_release.sh
          rm -f "$RUNNER_TEMP/notary-key.b64"
          xcrun stapler validate macos/dist/OmaSend.app
          spctl --assess --type execute --verbose=2 macos/dist/OmaSend.app
          xcrun stapler validate dist/*.dmg
      - name: Build macOS app (ad-hoc signed, not notarized)
        if: env.APPLE_CERTIFICATE_P12_BASE64 == ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          OMASEND_VERSION="$version" OMASEND_CONFIGURATION=release OMASEND_SIGN_IDENTITY=- bash macos/script/build_and_run.sh --no-launch
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/dist/OmaSend.app "dist/OmaSend_${version}_macOS_arm64.zip"
      - name: Remove signing keychain
        if: always() && env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: '[[ -z "$SIGNING_KEYCHAIN" ]] || security delete-keychain "$SIGNING_KEYCHAIN" || true'
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
  draft:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          cp install.ps1 release-assets/
          (cd release-assets && shopt -s nullglob && sha256sum *.exe *.zip *.tar.gz *.dmg install.ps1 > checksums.txt)
          gh release create "v$version" release-assets/* --draft --target "$GITHUB_SHA" --title "OmaSend $version" --notes-file docs/RELEASE-NOTES.md

