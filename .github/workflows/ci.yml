name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/omasend

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: swift build -c release
