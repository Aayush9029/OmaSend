name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- linux/internal/web/static

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/omasend
      - run: go build ./cmd/omasend-web
      - run: go test -race ./internal/web ./internal/daemon ./internal/protocol
      - name: Package all web companion targets
        run: VERSION=0.2.0 bash ../scripts/package-web.sh
      - uses: actions/upload-artifact@v6
        with:
          name: web-companion
          path: dist/OmaSendWeb_*

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: swift build -c release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache: false
      - run: cd linux; go test ./internal/daemon ./internal/web
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: dotnet restore windows/OmaSend/OmaSend.csproj --locked-mode
      - run: dotnet build windows/OmaSend/OmaSend.csproj -c Release --no-restore
      - run: dotnet run --project windows/OmaSend.Tests -c Release
      - run: ./tests/installer.ps1
      - run: pip install -r tests/requirements.txt
      - run: python tests/interop.py --bridge windows/OmaSend.Tests/bin/Release/net10.0/OmaSend.Tests.dll
        env:
          PYTHONIOENCODING: utf-8
      - run: python tests/interop.py --lan --bridge windows/OmaSend.Tests/bin/Release/net10.0/OmaSend.Tests.dll
        env:
          PYTHONIOENCODING: utf-8
